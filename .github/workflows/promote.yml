name: Promote

# Deliberate production promotion (and rollback): builds waffle-page/waffle at
# the given tag/ref and publishes the bundle into docs/, which GitHub Pages
# serves at app.waffle.page. Roll back by promoting an older tag.
# waffle is private; its checkout uses a repository-scoped read-only deploy
# key stored as the WAFFLE_READ_DEPLOY_KEY Actions secret.
# The bundle lives in docs/ so publishing NEVER overwrites this workflow —
# the v0.1.0 root-publish deleted the workflow with its own output.
#
# THIS REPOSITORY IS ALSO THE DESKTOP DOWNLOAD CHANNEL. The notarized .dmg is
# attached to the GitHub Release for the tag by waffle's own
# apps/desktop/release-macos.sh; this workflow writes the two files that point
# at it — docs/latest.json, which the installed app reads, and docs/download/,
# which a stranger lands on. Both are derived from the release for the tag being
# promoted, so the web bundle and the desktop image always describe ONE commit.
# See waffle's docs/recipes/promote-production.md for the full contract.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "waffle tag/ref to promote (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: waffle-page/waffle
          ref: ${{ inputs.ref }}
          path: source
          ssh-key: ${{ secrets.WAFFLE_READ_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm -C apps/web build
        working-directory: source

      - name: Publish bundle to docs/
        run: |
          rm -rf site/docs
          mkdir site/docs
          cp -R source/apps/web/dist/. site/docs/
          printf 'app.waffle.page\n' > site/docs/CNAME

      # docs/ was just wiped and rebuilt, so these two files are regenerated on
      # every promotion or are not present at all. Neither can go stale, and a
      # tag with no desktop image simply has no download page — the app reads
      # that 404 as "no published desktop build", which is true.
      - name: Write the desktop release manifest and download page
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # Only a vX.Y.Z tag names a desktop release. Promoting a branch or a
          # bare sha is legitimate and simply has no image to point at.
          case "$REF" in
            v[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::$REF is not a release tag; no desktop manifest written."
              exit 0
              ;;
          esac

          # `gh api` rather than `gh release view`: the REST shape is documented
          # and stable, and `browser_download_url` is the exact string the
          # manifest publishes and the app's decoder pins to a prefix.
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REF}" 2>/dev/null || true)"
          if [ -z "$release" ]; then
            echo "::notice::No GitHub Release for ${REF}; no desktop manifest written."
            exit 0
          fi

          image="$(printf '%s' "$release" | jq -c \
            '[.assets[] | select(.name | endswith("_aarch64.dmg"))][0] // empty')"
          if [ -z "$image" ]; then
            echo "::notice::Release ${REF} carries no macOS image; no desktop manifest written."
            exit 0
          fi

          name="$(printf '%s' "$image" | jq -r .name)"
          url="$(printf '%s' "$image" | jq -r .browser_download_url)"
          bytes="$(printf '%s' "$image" | jq -r .size)"
          published="$(printf '%s' "$release" | jq -r .published_at)"

          sidecar_url="$(printf '%s' "$release" | jq -r \
            --arg want "${name}.sha256" \
            '[.assets[] | select(.name == $want)][0].browser_download_url // empty')"
          if [ -z "$sidecar_url" ]; then
            echo "::error::Release ${REF} attaches ${name} but no ${name}.sha256."
            echo "A digest nobody can reproduce is worse than none. Attach it with"
            echo "  ./release-macos.sh --publish <dmg>"
            exit 1
          fi

          # THE DIGEST IS COMPUTED FROM THE SERVED BYTES, not copied from the
          # sidecar. This is the one place both halves exist to be compared: it
          # proves the URL the manifest publishes serves the bytes the release
          # script hashed. 13 MB in CI is a cheap price for that.
          curl -fsSL "$url" -o /tmp/image.dmg
          served="$(sha256sum /tmp/image.dmg | cut -d' ' -f1)"
          claimed="$(curl -fsSL "$sidecar_url" | cut -d' ' -f1)"
          if [ "$served" != "$claimed" ]; then
            echo "::error::${name} does not match its published digest."
            echo "  served:  ${served}"
            echo "  sidecar: ${claimed}"
            exit 1
          fi

          version="${REF#v}"
          # The promoted tree's own commit — the same one waffle-build.json
          # carries. It is what lets the app tell a pre-release apart from the
          # release it descends from; commits do not order, versions do.
          commit="$(git -C source rev-parse HEAD)"

          jq -n --arg version "$version" --arg commit "$commit" \
                --arg published "$published" --arg url "$url" \
                --arg sha256 "$served" --argjson bytes "$bytes" \
            '{version: $version, commitSha: $commit, published: $published,
              macos: {arm64: {url: $url, sha256: $sha256, bytes: $bytes}}}' \
            > site/docs/latest.json

          megabytes="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')"
          # The page is read by a person; the manifest keeps the full timestamp.
          day="${published%%T*}"
          mkdir -p site/docs/download
          cat > site/docs/download/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Download Waffle for macOS</title>
              <style>
                :root { color-scheme: light dark; --bg: #fbfaf8; --fg: #1b1a1f; --muted: #5b5a63; --line: #e2e0da; --accent: #1b1a1f; --accent-ink: #fbfaf8; --code: #f1efe9; }
                @media (prefers-color-scheme: dark) { :root { --bg: #17161c; --fg: #ecebf0; --muted: #a09fa9; --line: #2e2d36; --accent: #ecebf0; --accent-ink: #17161c; --code: #212028; } }
                html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
                body { margin: 0; padding: clamp(1.5rem, 6vw, 4rem) 1.25rem; background: var(--bg); color: var(--fg);
                       font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
                main { max-width: 34rem; margin: 0 auto; }
                h1 { margin: 0 0 0.35rem; font-size: clamp(1.6rem, 6vw, 2.1rem); letter-spacing: -0.02em; }
                p.lede { margin: 0 0 2rem; color: var(--muted); }
                a.get { display: inline-block; margin-bottom: 0.6rem; padding: 0.7rem 1.3rem; border-radius: 0.5rem;
                        background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; }
                p.meta { margin: 0 0 2.25rem; color: var(--muted); font-size: 0.875rem; }
                h2 { margin: 2rem 0 0.5rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
                ul { margin: 0; padding-left: 1.1rem; }
                li { margin-bottom: 0.3rem; }
                pre { overflow-x: auto; margin: 0.5rem 0 0; padding: 0.75rem 0.9rem; border-radius: 0.5rem; background: var(--code);
                      font-size: clamp(0.72rem, 2.6vw, 0.8rem); line-height: 1.5; }
                footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
                footer a { color: inherit; }
              </style>
            </head>
            <body>
              <main>
                <h1>Waffle for macOS</h1>
                <p class="lede">Your notes, links, files and dashboards in one library of ordinary
                folders on your own Mac. It reads and writes a normal folder of files; it never
                becomes the only thing that can open it.</p>

                <a class="get" href="${url}">Download Waffle ${version}</a>
                <p class="meta">Disk image, ${megabytes} MB &middot; published ${day}</p>

                <h2>Before you download</h2>
                <ul>
                  <li>Apple silicon only (M1 or later). There is no Intel build.</li>
                  <li>macOS 10.15 or later.</li>
                  <li>Signed by Waffle Corp. and notarized by Apple, so it opens without a
                      Gatekeeper warning. Open the disk image and drag Waffle to Applications.</li>
                </ul>

                <h2>Check what you downloaded</h2>
                <pre>shasum -a 256 ${name}
          ${served}</pre>

                <footer>
                  Waffle also runs in a browser at <a href="/">app.waffle.page</a>, where a library
                  lives in the browser rather than in a folder you can see.
                  <br />&copy; 2026 Waffle Corp. All rights reserved.
                </footer>
              </main>
            </body>
          </html>
          HTML

          echo "Wrote latest.json and download/ for ${name} (${served})."

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git config user.name "waffle-promote"
          git config user.email "promote@waffle"
          git add -A
          git commit -m "Promote waffle @ ${{ inputs.ref }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
